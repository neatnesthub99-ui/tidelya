<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BESTREVIEWS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <button class="icon-btn" aria-label="Menu">
    <svg width="34" height="28" viewBox="0 0 34 28" stroke="#0d1445" stroke-width="3"><path d="M0 4h34M0 14h34M0 24h34"/></svg>
  </button>
  <a class="logo" href="#">
    BESTR<svg class="logo-e" viewBox="0 0 16 26"><path d="M1 3l3 3 4-5 4 5 3-3v5H1z" fill="#d9a04a"/><rect x="1" y="12" width="14" height="3.500" fill="#0d1445"/><rect x="1" y="19" width="14" height="3.500" fill="#0d1445"/></svg>VIEWS
  </a>
  <button class="icon-btn" aria-label="Search">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#0d1445" stroke-width="3"><circle cx="12" cy="12" r="9"/><path d="M19 19l9 9"/></svg>
  </button>
</header>

<main>
  <div id="hero" class="collage"></div>
  <div class="wrap" id="featured"></div>

  <section class="wrap section">
    <h2 class="sec-title">THE LATEST</h2>
    <div id="latest"></div>
  </section>

  <section class="wrap section dark-line">
    <h2 class="sec-title">TOP DEALS</h2>
    <div class="deals" id="deals"></div>
  </section>
</main>

<button class="bestie" aria-label="Ask Bestie">
  <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round">
    <path d="M24 7c11 0 19 7 19 15s-8 15-19 15c-2 0-4-.3-6-.9L7 41l3.500-8.500C7.500 30 5 26 5 22 5 14 13 7 24 7z"/>
    <path d="M16 20h16M16 27h16" stroke-linecap="round"/>
    <path d="M18 4l3 3 3-4 3 4 3-3v4H18z" fill="#f5c24a" stroke="none"/>
  </svg>
  Ask Bestie
</button>
<button class="totop" aria-label="Back to top">&#9650;</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
