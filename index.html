<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BESTREVIEWS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <button class="icon-btn" aria-label="Menu">
    <svg width="34" height="28" viewBox="0 0 34 28" stroke="#0d1445" stroke-width="3"><path d="M0 4h34M0 14h34M0 24h34"/></svg>
  </button>
  <a class="logo" href="#">
    BESTR<svg class="logo-e" viewBox="0 0 16 26"><path d="M1 3l3 3 4-5 4 5 3-3v5H1z" fill="#d9a04a"/><rect x="1" y="12" width="14" height="3.5" fill="#0d1445"/><rect x="1" y="19" width="14" height="3.5" fill="#0d1445"/></svg>VIEWS
  </a>
  <button class="icon-btn" aria-label="Search">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#0d1445" stroke-width="3"><circle cx="12" cy="12" r="9"/><path d="M19 19l9 9"/></svg>
  </button>
</header>

<main>
  <div id="hero" class="collage"></div>
  <div class="wrap" id="featured"></div>

  <section class="wrap section">
    <h2 class="sec-title">THE LATEST</h2>
    <div id="latest"></div>
  </section>

  <section class="wrap section dark-line">
    <h2 class="sec-title">TOP DEALS</h2>
    <div class="deals" id="deals"></div>
  </section>

  <!-- ===== OUR TOP PICKS ===== -->
  <style>
  .tp{max-width:720px;margin:10px auto 0;padding:0 20px 30px}
  .tp h2{font-size:24px;font-weight:700;margin:0 0 6px;color:#0d1445}
  .tp h2::before{content:"";display:block;width:28px;height:4px;background:#d9a04a;margin:22px 0 10px}
  .tp p{font-size:16px;line-height:1.6;margin:0 0 16px;color:#0d1445}
  .tp-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tp-row::-webkit-scrollbar{display:none}
  .tp-card{flex:0 0 120px;scroll-snap-align:start;background:#fff;border:0;border-radius:8px;box-shadow:none;padding:4px 4px 6px;text-align:center;display:flex;flex-direction:column;color:#0d1445}
  .tp-card img{width:100%;height:90px;object-fit:contain;border-radius:6px}
  .tp-card b{display:block;font-size:13px;font-weight:700;margin-top:6px}
  .tp-card span{display:block;font-size:11.5px;line-height:1.3;margin-top:1px;min-height:0;margin-bottom:6px}
  .tp-card a{display:block;background:#4a5fc1;color:#fff;text-decoration:none;border-radius:20px;padding:6px 0;font-size:12px;margin-top:auto}
  </style>

  <section class="tp">
    <h2>OUR TOP PICKS</h2>
    <p>Some of our must-have essentials for this season, hand picked by our experts just for you.</p>
    <div class="tp-row" id="tpRow"></div>
  </section>

  <script>
  // پروڈکٹ بدلنے ہوں تو صرف یہ فہرست بدلیں
  var TP = [
    {brand:"Shark",   name:"StainStriker Portable Carpet and Upholstery Cleaner", img:"https://picsum.photos/seed/pick1/300/300", url:"#"},
    {brand:"CHIVALZ", name:"Dehumidifier",                                       img:"https://picsum.photos/seed/pick2/300/300", url:"#"},
    {brand:"Dyson",   name:"V15 Detect Absolute Cordless Vacuum",                img:"https://picsum.photos/seed/pick3/300/300", url:"#"},
    {brand:"Samsung", name:"Galaxy Tab S10 FE",                                  img:"https://picsum.photos/seed/pick4/300/300", url:"#"},
    {brand:"TOLOCO",  name:"Massage Gun",                                        img:"https://picsum.photos/seed/pick5/300/300", url:"#"}
  ];
  document.getElementById("tpRow").innerHTML = TP.map(function(p){
    return '<div class="tp-card"><img src="'+p.img+'" alt=""><b>'+p.brand+'</b><span>'+p.name+'</span><a href="'+p.url+'">Check Price</a></div>';
  }).join("");
  </script>
  <!-- ===== END OUR TOP PICKS ===== -->
</main>

<button class="bestie" aria-label="Ask Bestie">
  <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round">
    <path d="M24 7c11 0 19 7 19 15s-8 15-19 15c-2 0-4-.3-6-.9L7 41l3.5-8.5C7.5 30 5 26 5 22 5 14 13 7 24 7z"/>
    <path d="M16 20h16M16 27h16" stroke-linecap="round"/>
    <path d="M18 4l3 3 3-4 3 4 3-3v4H18z" fill="#f5c24a" stroke="none"/>
  </svg>
  Ask Bestie
</button>
<button class="totop" aria-label="Back to top">&#9650;</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
