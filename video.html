<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestReviews - Video</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; background-color: #ffffff; color: #0b1b36; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e0e0e0; margin-bottom: 15px; }
        nav .logo { font-size: 22px; font-weight: bold; letter-spacing: 2px; text-decoration: none; color: inherit; }
        nav .back { font-size: 28px; text-decoration: none; color: inherit; }
        
        /* ویڈیو */
        .video-box { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #00bcd4; }
        .video-box img { width: 100%; display: block; }
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; color: rgba(255, 255, 255, 0.9); }
        
        .shop-text { font-size: 24px; font-weight: bold; margin: 20px 0 15px 0; color: #0b1b36; }
        
        /* پروڈکٹس لائن */
        .products-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px; }
        .product { width: 32%; text-align: center; }
        
        /* تصویر کا بارڈر (بالکل سیم) */
        .img-box { border: 1px solid #ccc; border-radius: 12px; padding: 10px; height: 110px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; background: #fff; }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .brand { font-weight: bold; font-size: 16px; margin-bottom: 2px; color: #000; }
        .name { font-size: 14px; color: #333; margin-bottom: 12px; height: 38px; line-height: 1.3; overflow: hidden; }
        
        /* بٹن (بالکل سیم نیلا کلر) */
        .btn { background-color: #5a6bd8; color: white; border: none; padding: 10px 0; border-radius: 20px; font-size: 16px; width: 100%; cursor: pointer; font-weight: normal; }
    </style>
</head>
<body>
<div class="container">
    <nav>
        <a href="index.html" class="back">←</a>
        <a href="index.html" class="logo">BESTREVIEWS</a>
        <div style="width: 28px;"></div>
    </nav>

    <div class="video-box">
        <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?q=80&w=800&auto=format&fit=crop" alt="Video">
        <div class="play-icon">▶</div>
    </div>

    <div class="shop-text">Shop the video</div>
    
    <!-- پہلی لائن -->
    <div class="products-row">
        <div class="product">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1620916297397-a4a5402a3c6c?q=80&w=300&auto=format&fit=crop" alt="Massage Gun"></div>
            <div class="brand">TOLOCO</div>
            <div class="name">Massage Gun</div>
            <button class="btn">Shop now</button>
        </div>
        <div class="product">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?q=80&w=300&auto=format&fit=crop" alt="Samsung Tab"></div>
            <div class="brand">Samsung</div>
            <div class="name">Galaxy Tab S10 FE</div>
            <button class="btn">Shop now</button>
        </div>
        <div class="product">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1558317374-067fb5f30001?q=80&w=300&auto=format&fit=crop" alt="Dyson V15"></div>
            <div class="brand">Dyson</div>
            <div class="name">V15 Detect Absolute with Car Cleaning Kit</div>
            <button class="btn">Shop now</button>
        </div>
    </div>

    <!-- دوسری لائن -->
    <div class="products-row">
        <div class="product">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1585771724684-38269d6639fd?q=80&w=300&auto=format&fit=crop" alt="Dyson V8"></div>
            <div class="brand">Dyson</div>
            <div class="name">V8 Cyclone</div>
            <button class="btn">Shop now</button>
        </div>
        <div class="product">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=300&auto=format&fit=crop" alt="Money.com"></div>
            <div class="brand">Money.com</div>
            <div class="name">Home Equity Loan</div>
            <button class="btn">Shop now</button>
        </div>
        <div class="product" style="visibility: hidden;"></div>
    </div>

</div>
</body>
</html>
