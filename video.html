<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Deals</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1445;--teal:#4f9db3;--gold:#d9a04a;--link:#4a5fc1;--line:#dcdcdc;--muted:#666}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:#fff;color:var(--navy);font-family:Montserrat,Arial,sans-serif;line-height:1.3;padding-bottom:90px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

.story{padding:20px 0;border-bottom:2px solid var(--line)}
.story.last{border-bottom:0}
.story h2{font-size:1.15rem;line-height:1.3;margin:0;font-weight:600}
.story h2 a{color:inherit;text-decoration:none}
.meta{font-family:Georgia,"Times New Roman",serif;color:var(--muted);font-size:.85rem;margin-bottom:8px}
.meta .bar{margin:0 4px}
.meta b{font-family:Montserrat,sans-serif;color:var(--teal);font-weight:600;font-size:.9rem;text-transform:uppercase}

.video{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin:6px 0 18px;
  background:repeating-conic-gradient(from 0deg at 50% 50%,#2a8cf0 0 6deg,#1c6fe0 6deg 12deg)}
.video::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(160,255,255,.95) 0,rgba(60,190,255,.5) 35%,transparent 70%)}
.logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.85}
.logo .e{font-size:min(13vw,5rem);font-weight:700;color:#1d63c9;letter-spacing:-2px}
.logo .d{font-size:min(10.5vw,4rem);font-weight:700;color:#f5a21b;letter-spacing:-2px}
.play{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1/1.1;transform:translate(-40%,-50%);background:rgba(255,255,255,.5);
  clip-path:polygon(0 0,100% 50%,0 100%)}
.story .link{display:inline-block;margin-top:12px;color:var(--link);font-size:1rem;text-decoration:underline}

.deals{border-top:2px solid #222;margin-top:24px;padding-top:32px}
.deals::before{content:"";display:block;width:28px;height:4px;background:var(--gold);margin-bottom:20px}
.deals h1{font-size:1.7rem;line-height:1;margin:0 0 22px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 20px}
.card{min-width:0}
.pic{width:65px;height:65px;border-radius:8px;overflow:hidden;background:#fff}
.pic svg,.pic img{width:100%;height:100%;display:block;object-fit:contain}
.card a{display:block;margin-top:12px;color:var(--navy);font-size:.95rem;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.card .sub{font-weight:700;font-size:.8rem;line-height:1;text-transform:uppercase}
.card .price{color:var(--gold);font-weight:700;font-size:1.35rem;margin-top:6px}
.card .off{font-weight:600;font-size:.85rem;margin-top:2px}

.bestie{position:fixed;left:12px;bottom:12px;display:flex;align-items:center;gap:10px;padding:10px 24px 10px 14px;border:0;border-radius:40px;color:#fff;
  font:700 1.05rem Montserrat,sans-serif;background:linear-gradient(90deg,#1b2a6b 0%,#4f5cc0 55%,#5db8c9 100%);box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:10}
.bestie svg{width:32px;height:32px}
.totop{position:fixed;right:12px;bottom:0;width:44px;height:40px;background:#fff;border:1px solid #ccc;border-bottom:0;border-radius:8px 8px 0 0;
  cursor:pointer;display:grid;place-items:center;color:#9a9a9a;font-size:1.1rem;z-index:10}

@media(min-width:700px){
  .story h2{font-size:1.5rem}.deals h1{font-size:2.2rem}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pic{width:90px;height:90px}
}
</style>
</head>
<body>
<main class="wrap">

  <article class="story">
    <h2><a href="#">...month and is less than $30</a></h2>
  </article>

  <article class="story">
    <div class="meta">Oct. 19, 2026 <span class="bar">|</span> <b>Toys &amp; Games</b></div>
    <h2><a href="#">Barbie has a new DreamHouse — in this economy?</a></h2>
  </article>

  <article class="story last">
    <div class="meta">Oct. 20, 2026 <span class="bar">|</span> <b>Home</b></div>
    <a class="video" href="#" aria-label="Play video">
      <div class="logo"><span class="e">EPIC</span><span class="d">discounts</span></div>
      <div class="play"></div>
    </a>
    <h2><a href="#">Epic Discounts: Home sweet home: Clever finds for your home, self and wallet</a></h2>
    <a class="link" href="#">View and shop the video</a>
  </article>

  <section class="deals">
    <h1>TOP DEALS</h1>
    <div class="grid" id="deals"></div>
  </section>
</main>

<button class="bestie" aria-label="Ask Bestie">
  <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round">
    <path d="M24 5c11 0 19 7 19 16s-8 16-19 16c-2 0-4-.3-6-.9L7 41l3.5-8.5C7.5 30 5 26 5 21 5 12 13 5 24 5z"/>
    <path d="M16 19h16M16 26h16" stroke-linecap="round"/>
  </svg>
  Ask Bestie
</button>
<div class="totop" role="button" aria-label="Back to top" onclick="scrollTo({top:0,behavior:'smooth'})">&#9650;</div>

<script>
const houseSVG=`<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#cfe6fb"/>
<rect y="165" width="200" height="35" fill="#5da24a"/>
<rect x="20" y="85" width="120" height="85" fill="#2f4f86"/>
<rect x="125" y="110" width="60" height="60" fill="#f1f1f1"/>
<polygon points="10,90 80,40 150,90" fill="#555a63"/>
<polygon points="120,115 155,92 195,115" fill="#555a63"/>
<rect x="38" y="100" width="28" height="28" fill="#fff"/><rect x="92" y="100" width="28" height="28" fill="#fff"/>
<rect x="38" y="138" width="28" height="26" fill="#fff"/><rect x="92" y="138" width="28" height="26" fill="#fff"/>
<rect x="72" y="138" width="14" height="30" fill="#7a3b2e"/>
<rect x="132" y="130" width="46" height="35" fill="#fff" stroke="#ccc"/></svg>`;
const vacSVG=`<svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#fff"/>
<rect x="120" y="22" width="12" height="105" rx="5" fill="#8a8a8a" transform="rotate(8 126 70)"/>
<rect x="118" y="18" width="26" height="40" rx="8" fill="#d9a04a" transform="rotate(8 126 40)"/>
<circle cx="132" cy="22" r="9" fill="#7a1f2e"/>
<path d="M122 125 L158 178 L120 182 Z" fill="#555"/>
<rect x="118" y="172" width="48" height="12" rx="5" fill="#6b4fa0"/>
<rect x="28" y="30" width="5" height="32" fill="#888"/><rect x="40" y="48" width="5" height="26" fill="#888"/>
<rect x="30" y="86" width="5" height="22" fill="#c04040"/></svg>`;

const deals=[
  {title:"Money.com Home Equity Loan", sub:"Best Home Equity Loans of 2026", svg:houseSVG},
  {title:"Dyson V15 Detect Absolute with Car Cleaning Kit", price:"$599.99", off:"33% OFF", svg:vacSVG},
];

document.getElementById("deals").innerHTML=deals.map(d=>`
  <div class="card">
    <div class="pic">${d.img?`<img src="${d.img}" alt="">`:d.svg}</div>
    <a href="#">${d.title}</a>
    ${d.sub?`<div class="sub">${d.sub}</div>`:""}
    ${d.price?`<div class="price">${d.price}</div><div class="off">${d.off}</div>`:""}
  </div>`).join("");
</script>
</body>
</html>
